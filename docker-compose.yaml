version: '3.9'
services:
  app:
    restart: always
    build:
      dockerfile: Dockerfile
      context: .
    ports:
      - 3000:3000
    env_file:
      - .env
    volumes:
     - /var/lib/docker/volumes/online-shop-front_data-certs/_data:/etc/nginx/ssl
    command: [ "npm", "run", "start" ]

  mongo:
    user: root
    image: mongo:4.4.6
    restart: always
    expose:
      - "27017"
    ports:
      - 27027:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_LOGIN}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    # сделать 'touch /home/mongodb_bread/.dbshell && chown -R 999:999 /home/mongodb_bread'
    # нахуя? - не спрашивайте
    volumes: 
      - /home/mongodb_bread:/home/mongodb
      - /var/data/mongodb_bread:/data/db

